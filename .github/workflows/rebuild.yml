name: Rebuild from a career-compass-mcp release

# Checks npm once a day. When a career-compass-mcp release is newer than this plugin, it
# rebuilds server/ from the published package with the build script in career-compass-mcp
# (scripts/build-plugin-bundle.mjs) and opens a pull request here. Merging that pull request
# is what sends the new version to the Claude directory.
#
# Uses only this repo's own GITHUB_TOKEN, so there is no secret to create or rotate. It needs
# one repository setting: Settings > Actions > General > "Allow GitHub Actions to create and
# approve pull requests".

on:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:
    inputs:
      version:
        description: "Exact career-compass-mcp version to bundle (blank = latest on npm)"
        required: false

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: rebuild
  cancel-in-progress: false

jobs:
  rebuild:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          package-manager-cache: false

      - name: Decide whether there is anything to build
        id: v
        env:
          INPUT_VERSION: ${{ inputs.version }}
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${INPUT_VERSION:-$(npm view career-compass-mcp version)}"
          if ! [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Not an exact version: '$version'"
            exit 1
          fi
          current="$(node -p "require('./.claude-plugin/plugin.json').version")"
          echo "npm: $version  plugin: $current"
          build=true
          if [ -z "$INPUT_VERSION" ] && [ "$version" = "$current" ]; then build=false; fi
          if gh pr list --head "bundle/v$version" --state open --json number --jq 'length' | grep -qv '^0$'; then
            echo "A pull request for $version is already open."
            build=false
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "build=$build" >> "$GITHUB_OUTPUT"

      # The release's own source (skill, icon, privacy policy), plus the current build script
      # from the default branch, so a release made before a script fix still builds.
      #
      # The source commit comes from the gitHead field npm records at publish time, so a
      # release needs no v<version> tag. The tag is only a fallback for a package published
      # without one. Either way, the commit's package.json has to name the same version.
      - name: Fetch career-compass-mcp
        id: src
        if: steps.v.outputs.build == 'true'
        env:
          VERSION: ${{ steps.v.outputs.version }}
        run: |
          repo=https://github.com/benskamps/career-compass-mcp
          sha="$(npm view "career-compass-mcp@$VERSION" gitHead 2>/dev/null || true)"
          git init --quiet "$RUNNER_TEMP/mcp"
          git -C "$RUNNER_TEMP/mcp" remote add origin "$repo"
          if [[ "$sha" =~ ^[0-9a-f]{40}$ ]]; then
            echo "Source: gitHead $sha"
            git -C "$RUNNER_TEMP/mcp" fetch --quiet --depth 1 origin "$sha"
          else
            echo "::warning::npm has no gitHead for $VERSION; falling back to tag v$VERSION"
            git -C "$RUNNER_TEMP/mcp" fetch --quiet --depth 1 origin "refs/tags/v$VERSION"
          fi
          git -C "$RUNNER_TEMP/mcp" checkout --quiet --detach FETCH_HEAD
          sha="$(git -C "$RUNNER_TEMP/mcp" rev-parse HEAD)"
          at="$(node -p "require('$RUNNER_TEMP/mcp/package.json').version")"
          if [ "$at" != "$VERSION" ]; then
            echo "::error::Commit $sha has package.json version $at, not $VERSION"
            exit 1
          fi
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          git -C "$RUNNER_TEMP/mcp" fetch --quiet --depth 1 origin main
          git -C "$RUNNER_TEMP/mcp" show FETCH_HEAD:scripts/build-plugin-bundle.mjs > "$RUNNER_TEMP/mcp/scripts/build-plugin-bundle.mjs"

      # esbuild only traces which files the server loads; see the script's header.
      - name: Install esbuild
        if: steps.v.outputs.build == 'true'
        working-directory: ${{ runner.temp }}/mcp/scripts
        run: npm i --prefix . --no-save --no-package-lock --no-audit --no-fund esbuild@0.28.2

      - name: Build the bundle
        if: steps.v.outputs.build == 'true'
        env:
          CC_SOURCE_DIR: ${{ runner.temp }}/mcp
          VERSION: ${{ steps.v.outputs.version }}
          SHA: ${{ steps.src.outputs.sha }}
        run: |
          node "$RUNNER_TEMP/mcp/scripts/build-plugin-bundle.mjs" "$VERSION"
          # The script links the source as tree/v<version>. Point it at the commit instead,
          # which exists whether or not the release was tagged.
          sed -i "s#/tree/v$VERSION)#/tree/$SHA)#g" BUNDLE.md
          grep -q "/tree/$SHA)" BUNDLE.md

      - name: Smoke-test the bundled server
        if: steps.v.outputs.build == 'true'
        run: |
          printf '%s\n' \
            '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2025-06-18","capabilities":{},"clientInfo":{"name":"ci","version":"1"}}}' \
            '{"jsonrpc":"2.0","method":"notifications/initialized"}' \
            '{"jsonrpc":"2.0","id":2,"method":"tools/list","params":{}}' \
            | HOME="$RUNNER_TEMP/home" timeout 20 node server/build/src/index.js > "$RUNNER_TEMP/out.jsonl" || true
          count=$(grep '"id":2' "$RUNNER_TEMP/out.jsonl" | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>console.log(JSON.parse(s).result.tools.length))')
          echo "tools: $count"
          test "$count" -eq 19
          # Server instructions are what Claude Code loads at session start when tool search
          # defers the tools, and it cuts them at 2,048 characters.
          grep '"id":1' "$RUNNER_TEMP/out.jsonl" | node -e '
            let s = ""; process.stdin.on("data", (d) => (s += d)).on("end", () => {
              const text = JSON.parse(s).result.instructions;
              const n = typeof text === "string" ? text.trim().length : 0;
              console.log(`instructions: ${n} chars`);
              if (n === 0) { console.log("::error::initialize returned no server instructions"); process.exit(1); }
              if (text.length > 2048) { console.log(`::error::server instructions are ${text.length} chars; Claude Code truncates at 2048`); process.exit(1); }
            });'

      # Cowork skips an MCP server whose userConfig option has no default, so the data
      # folder option has to keep one.
      - name: Check the data folder option keeps its default
        if: steps.v.outputs.build == 'true'
        run: |
          node -e '
            const p = require("./.claude-plugin/plugin.json");
            const d = p.userConfig && p.userConfig.data_path && p.userConfig.data_path.default;
            if (typeof d !== "string" || d.trim() === "") {
              console.log("::error::plugin.json userConfig.data_path.default is not set");
              process.exit(1);
            }
            console.log(`userConfig.data_path.default: ${d}`);'

      # The same validator the directory runs. --strict fails on warnings too, such as an
      # unrecognized manifest field. Pinned so a CLI release can't change the verdict
      # between two runs of the same bundle; 2.1.281 and later know the listing URL fields.
      - name: Validate the plugin
        if: steps.v.outputs.build == 'true'
        run: npx -y @anthropic-ai/claude-code@2.1.292 plugin validate --strict .

      - name: Open a pull request
        if: steps.v.outputs.build == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.v.outputs.version }}
          SHA: ${{ steps.src.outputs.sha }}
        run: |
          if [ -z "$(git status --porcelain)" ]; then
            echo "Already matches $VERSION; nothing to do."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "bundle/v$VERSION"
          git add -A
          git commit -m "Bundle career-compass-mcp $VERSION" -m "Source: benskamps/career-compass-mcp@$SHA (npm gitHead)"
          git push -u origin "bundle/v$VERSION"
          gh pr create --title "Bundle career-compass-mcp $VERSION" \
            --body "Rebuilt server/ from career-compass-mcp@$VERSION on npm (source commit $SHA) with scripts/build-plugin-bundle.mjs from career-compass-mcp. See BUNDLE.md."
